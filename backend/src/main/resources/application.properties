spring.application.name=financial-product-favorites

# 連線設定可用環境變數覆寫，預設值對應 DB 腳本建立的本機環境
spring.datasource.url=${FAVORITES_DB_URL:jdbc:mysql://localhost:3306/favorites}
spring.datasource.username=${FAVORITES_DB_USERNAME:favorites_app}
spring.datasource.password=${FAVORITES_DB_PASSWORD:Favorites-App-2026}

# 預設只接受本機連線，部署時由 Nginx 轉送
server.address=${FAVORITES_BIND_ADDRESS:127.0.0.1}

# 請求裡出現沒定義的欄位（例如偷塞 userId）直接回 400
spring.jackson.deserialization.fail-on-unknown-properties=true
# 數量送 1.5 要回 400，不能被悄悄截成 1
spring.jackson.deserialization.accept-float-as-int=false

# 位於 Nginx 後方時，依 X-Forwarded-* 判斷原始請求是不是 HTTPS，Session 與 CSRF Cookie 才會帶 Secure
# 手動部署時，後端只監聽 127.0.0.1，容器版不對主機開放後端埠
server.forward-headers-strategy=native

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
