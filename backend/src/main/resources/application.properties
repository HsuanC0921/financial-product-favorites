spring.application.name=financial-product-favorites

# 連線設定可用環境變數覆寫，預設值對應 DB 腳本建立的本機環境
spring.datasource.url=${FAVORITES_DB_URL:jdbc:mysql://localhost:3306/favorites}
spring.datasource.username=${FAVORITES_DB_USERNAME:favorites_app}
spring.datasource.password=${FAVORITES_DB_PASSWORD:Favorites-App-2026}

# 預設只接受本機連線，部署時由 Nginx 轉送
server.address=${FAVORITES_BIND_ADDRESS:127.0.0.1}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
