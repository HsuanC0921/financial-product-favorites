# Web Server 層：提供前端靜態檔，把 /api 反向代理到 Spring Boot，並負責 TLS、安全標頭與登入限流
# 以 deploy 資料夾為前置路徑啟動：nginx -p deploy -c nginx.conf，步驟見 README
# 憑證放在 deploy/certs/，不納入版本控制

worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 256;
}

http {
    # 只列前端用到的類型，不依賴另外的 mime.types
    types {
        text/html               html;
        text/css                css;
        application/javascript  js mjs;
        image/svg+xml           svg;
    }
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # 請求本文只有小型的 JSON 與表單
    client_max_body_size 64k;

    # 對後端保留連線重複使用。沒有這個設定時，每個請求都新開一條 TCP 連線，
    # 高流量下本機埠會被用光，Nginx 回 502
    upstream spring_boot {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    # 登入限流：同一個來源位址每分鐘 10 次，另容許 5 次突發，超過回 429
    limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
    limit_req_status 429;

    # HTTP 一律轉到 HTTPS
    server {
        listen 127.0.0.1:80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        # 預設只接受本機連線，對外開放時改成 listen 443 ssl
        listen 127.0.0.1:443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     certs/cert.pem;
        ssl_certificate_key certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:1m;
        ssl_session_timeout 1h;

        # 安全標頭，一律加在 server 層，location 內不再用 add_header，避免蓋掉這裡的設定
        # HSTS 在本機自簽憑證下只設 300 秒，正式環境改成 31536000
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # 對後端的請求：告知原始的協定與來源，Spring 才能判斷這是 HTTPS 請求
        # X-Forwarded-For 直接覆寫成連線來源，不信任用戶端自己帶的值
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # 這些標頭由上面統一設定，後端回的就不重複輸出
        # 瀏覽器遇到多個 HSTS 只採用第一個，不藏掉的話會變成 Spring Security 預設的一年加子網域
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            error_page 429 = @too_many_logins;
            proxy_pass http://spring_boot;
        }

        # 回應格式與後端的錯誤一致，前端可以直接顯示訊息
        location @too_many_logins {
            default_type application/json;
            return 429 '{"code":"TOO_MANY_REQUESTS","message":"登入嘗試次數過多，請 1 分鐘後再試"}';
        }

        location /api/ {
            proxy_pass http://spring_boot;
        }

        # 前端建置結果，相對於前置路徑 deploy
        root ../frontend/dist;
        index index.html;

        # 檔名帶雜湊，可以長期快取
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # 入口頁每次都重新確認，才能拿到新版的資源檔名
        location = /index.html {
            expires -1;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
